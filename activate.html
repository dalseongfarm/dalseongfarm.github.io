<body>
<main>
  <div class="card">
    <h1>주문서 받기 켜기</h1>
    <p>홈페이지 주문서가 <b>9101kjs@gmail.com</b>으로 들어오게 하려면 처음 한 번만 이 과정을 하면 돼요.</p>
    <ol>
      <li>아래 버튼을 누르세요.</li>
